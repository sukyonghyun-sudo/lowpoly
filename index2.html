<!-- TPS Horror — 굴다리 (Cave Underpass) -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root{
    --bg:#07080a; --panel:#0e1014; --panel2:#14171d; --line:#23272f;
    --txt:#c8ccd2; --dim:#7c828c; --accent:#c2362f; --accent2:#e8a13a;
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:var(--mono);color:var(--txt);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;touch-action:none}
  /* mobile virtual joystick (touch only) */
  #stick{position:fixed;left:22px;bottom:26px;width:128px;height:128px;border-radius:50%;z-index:7;
    background:rgba(18,21,27,.45);border:1px solid var(--line);touch-action:none;display:none;
    backdrop-filter:blur(2px)}
  #stick #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(194,54,47,.85);border:2px solid #1a1d22;box-shadow:0 0 12px rgba(194,54,47,.55)}
  #stick .ring{position:absolute;inset:8px;border-radius:50%;border:1px dashed #3a3f49;opacity:.5}
  @media (hover:none) and (pointer:coarse){ #stick{display:block} #hint{display:none} }
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 120% at 50% 42%,transparent 50%,rgba(0,0,0,.6) 100%)}
  #title{position:fixed;top:14px;left:18px;z-index:6;pointer-events:none;
    text-transform:uppercase;letter-spacing:.32em;font-size:11px;color:var(--dim)}
  #title b{display:block;letter-spacing:.18em;font-size:15px;color:#e9ebee;margin-bottom:3px}
  #title .red{color:var(--accent)}
  #toggle{position:fixed;top:12px;right:12px;z-index:9;width:42px;height:42px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;cursor:pointer;font-size:18px;line-height:40px;text-align:center}
  #toggle:hover{border-color:var(--accent)}
  #panel{position:fixed;top:0;right:0;z-index:8;height:100%;width:330px;max-width:88vw;
    background:linear-gradient(180deg,#0d0f13,#0a0b0e);border-left:1px solid var(--line);
    box-shadow:-14px 0 40px rgba(0,0,0,.6);overflow-y:auto;padding:60px 14px 40px;transition:transform .28s ease}
  #panel.hidden{transform:translateX(105%)}
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:#242830;border-radius:8px}
  details{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:var(--panel2);overflow:hidden}
  details[open]{border-color:#2c313b}
  summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#dfe2e7;display:flex;align-items:center;gap:9px;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  summary:hover{background:#171b22}
  .body{padding:6px 13px 14px}
  .row{margin:11px 0}
  .row label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:5px}
  .row label .val{color:var(--accent2);font-variant-numeric:tabular-nums}
  .row label .stepper{display:flex;align-items:center;gap:4px}
  .step{width:21px;height:21px;line-height:1;text-align:center;border:1px solid var(--line);
    background:#171b22;color:var(--accent2);border-radius:5px;cursor:pointer;
    font-family:var(--mono);font-size:14px;padding:0;display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;touch-action:none}
  .step:hover{border-color:var(--accent);color:#fff}
  .step:active{background:var(--accent);color:#fff}
  .num{width:60px;height:21px;background:#0a0c0f;border:1px solid var(--line);color:var(--accent2);
    border-radius:5px;text-align:center;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
  .num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .num:focus{outline:none;border-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:#2a2f38;border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid #1a1d22;box-shadow:0 0 6px rgba(194,54,47,.6)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid #1a1d22;border-radius:50%;background:var(--accent);cursor:pointer}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  button.ctl{flex:1;min-width:80px;background:#171b22;border:1px solid var(--line);color:var(--txt);
    padding:9px;border-radius:7px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;cursor:pointer}
  button.ctl:hover{border-color:var(--accent);color:#fff}
  button.ctl.on{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ctl.amber.on{background:var(--accent2);border-color:var(--accent2);color:#1a1206}
  .colorrow{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--dim)}
  input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:5px;background:none;padding:0;cursor:pointer}
  .readout{font-size:10.5px;color:var(--dim);line-height:1.7;white-space:pre-wrap;
    background:#0a0c0f;border:1px solid var(--line);border-radius:7px;padding:9px 11px}
  .readout b{color:var(--accent2)}
  .io{width:100%;height:150px;background:#0a0c0f;border:1px solid var(--line);color:var(--accent2);
    border-radius:7px;padding:8px;font:10px/1.45 var(--mono);resize:vertical;white-space:pre;margin-top:4px}
  .io:focus{outline:none;border-color:var(--accent)}
  #loader{position:fixed;inset:0;z-index:20;background:#050608;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
  #loader.done{opacity:0;pointer-events:none}
  .spin{width:42px;height:42px;border:2px solid #20232a;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #ltxt{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  #lbar{width:200px;height:3px;background:#1a1d22;border-radius:3px;overflow:hidden}
  #lbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  #lerr{display:none;max-width:320px;text-align:center;font-size:11px;color:var(--accent);line-height:1.6}
  #hint{position:fixed;bottom:12px;left:18px;z-index:6;font-size:10.5px;color:#5a606a;pointer-events:none}
  #coords{position:fixed;top:62px;left:18px;z-index:6;font:12px/1.5 var(--mono);color:#9fb6d9;
    pointer-events:none;text-shadow:0 1px 3px #000;letter-spacing:.04em}
  #coords b{color:var(--accent2)} #coords .in{color:var(--accent)}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#2a0d0d;color:#ffb4ac;
    font:11px/1.5 var(--mono);padding:8px 12px;display:none;white-space:pre-wrap;max-height:32vh;overflow:auto;border-top:1px solid #5a1f1f}
  #err.show{display:block}
  /* jumpscare */
  #scare{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#3a0000,#000)}
  #scare.active{display:flex}
  #scare.active svg{animation:sIn .1s ease both, sShake .06s steps(2) 0s 8}
  #scare.fade{animation:sOut .45s ease both}
  #scare svg{width:64vmin;height:64vmin;filter:drop-shadow(0 0 40px #000)}
  @keyframes sIn{from{opacity:0;transform:scale(1.5)}to{opacity:1;transform:scale(1)}}
  @keyframes sShake{0%{transform:translate(-9px,5px) rotate(-1deg)}100%{transform:translate(9px,-5px) rotate(1deg)}}
  @keyframes sOut{to{opacity:0}}
  #flashfx{position:fixed;inset:0;z-index:29;background:#fff;opacity:0;pointer-events:none}
  @media(max-width:560px){#title{display:none}}
</style>

<div id="stage"></div>
<div id="vignette"></div>
<div id="flashfx"></div>
<div id="title"><b>굴다리 <span class="red">／ THE UNDERPASS</span></b>TPS · HORROR</div>
<div id="hint">이동 <b style="color:#c2362f">WASD / 방향키</b> · 드래그=시점 · 휠=줌 · ⚙ 패널</div>
<div id="coords"></div>
<div id="stick"><div class="ring"></div><div id="knob"></div></div>
<button id="toggle" title="패널">⚙</button>
<div id="err"></div>

<div id="loader">
  <div class="spin"></div>
  <div id="ltxt">에셋 불러오는 중…</div>
  <div id="lbar"><i></i></div>
  <div id="lerr"></div>
</div>

<div id="scare">
  <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="100" cy="120" rx="72" ry="100" fill="#d9d2c4"/>
    <ellipse cx="100" cy="120" rx="72" ry="100" fill="none" stroke="#6b6354" stroke-width="2"/>
    <ellipse cx="68" cy="100" rx="20" ry="26" fill="#040404"/>
    <ellipse cx="132" cy="100" rx="20" ry="26" fill="#040404"/>
    <circle cx="74" cy="94" r="4" fill="#7a0000"/>
    <circle cx="126" cy="94" r="4" fill="#7a0000"/>
    <path d="M70 70 Q68 58 84 60" stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M130 70 Q132 58 116 60" stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M70 168 Q100 220 130 168 Q100 196 70 168 Z" fill="#0a0202"/>
    <path d="M74 170 l8 18 M88 174 l4 22 M100 176 l0 24 M112 174 l-4 22 M126 170 l-8 18"
          stroke="#cabfae" stroke-width="3"/>
    <path d="M96 110 l8 0 -4 44 z" fill="#b8ad9b"/>
  </svg>
</div>

<div id="panel"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const errEl=document.getElementById('err');
function showErr(m){ if(errEl){ errEl.textContent='⚠ '+m; errEl.classList.add('show'); } }
addEventListener('error',e=>showErr((e.message||'error')+(e.filename?(' @ '+(e.filename.split('/').pop())+':'+e.lineno):'')));
addEventListener('unhandledrejection',e=>showErr('promise: '+((e.reason&&e.reason.message)||e.reason)));

const REPO='sukyonghyun-sudo/lowpoly';
const SRC={
  cave:[`https://cdn.jsdelivr.net/gh/${REPO}@main/lee/cave.glb`,`https://raw.githubusercontent.com/${REPO}/main/lee/cave.glb`],
  char:[`https://cdn.jsdelivr.net/gh/${REPO}@main/lee/Walking.fbx`,`https://raw.githubusercontent.com/${REPO}/main/lee/Walking.fbx`],
  idle:[`https://cdn.jsdelivr.net/gh/${REPO}@main/lee/Idle.fbx`,`https://raw.githubusercontent.com/${REPO}/main/lee/Idle.fbx`],
  trash:[`https://cdn.jsdelivr.net/gh/${REPO}@main/lee/trash_bag.glb`,`https://raw.githubusercontent.com/${REPO}/main/lee/trash_bag.glb`]
};

// ---------- renderer / scene / camera ----------
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0c10);
scene.fog=new THREE.FogExp2(0x0a0c10,0.04);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.05,2000);
camera.position.set(0,2.2,7);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.target.set(0,1,0);
controls.enabled=false;

// ---------- lights ----------
const base={amb:0.6,hemi:0.55,moon:0.6,fogD:0.04,exposure:1.15};
const ambient=new THREE.AmbientLight(0x8a93a6,base.amb); scene.add(ambient);
const hemi=new THREE.HemisphereLight(0xb9c6e0,0x101216,base.hemi); scene.add(hemi);
const moon=new THREE.DirectionalLight(0x9fb6d9,base.moon);
moon.position.set(-6,14,8); moon.castShadow=true; moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.near=0.5; moon.shadow.camera.far=45;
moon.shadow.camera.left=-8;moon.shadow.camera.right=8;moon.shadow.camera.top=8;moon.shadow.camera.bottom=-8;
moon.shadow.bias=-0.0004; moon.shadow.camera.updateProjectionMatrix(); scene.add(moon); scene.add(moon.target);
const flash=new THREE.SpotLight(0xfff2d0,0,70,Math.PI/7,0.45,1.0);
flash.castShadow=true; flash.shadow.mapSize.set(1024,1024);
const flashTarget=new THREE.Object3D(); scene.add(flashTarget); flash.target=flashTarget;
camera.add(flash); scene.add(camera);

// ---------- ground ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({color:0x0c0e11,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

// contact (blob) shadow under the character
function makeBlobTex(){ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,3,64,64,62);
  grd.addColorStop(0,'rgba(0,0,0,0.6)'); grd.addColorStop(0.55,'rgba(0,0,0,0.3)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd; g.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
const blob=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.1),
  new THREE.MeshBasicMaterial({map:makeBlobTex(),transparent:true,depthWrite:false,opacity:1}));
blob.rotation.x=-Math.PI/2; blob.renderOrder=2; scene.add(blob);

// ---------- post-processing (filters) ----------
const FX={
  uniforms:{
    tDiffuse:{value:null}, uRes:{value:new THREE.Vector2(1,1)}, uTime:{value:0},
    uPixel:{value:0.0}, uPoster:{value:0.0}, uScan:{value:0.0}, uCine:{value:0.0}, uGrain:{value:0.0},
    uDesat:{value:0.0}, uContrast:{value:1.0}, uTint:{value:new THREE.Vector3(1,1,1)},
    uMDesat:{value:0.0}, uMCon:{value:1.0}, uMBright:{value:1.0}, uMTint:{value:new THREE.Vector3(1,1,1)}
  },
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime,uPixel,uPoster,uScan,uCine,uGrain,uDesat,uContrast,uMDesat,uMCon,uMBright; uniform vec3 uTint,uMTint;
    varying vec2 vUv;
    float rnd(vec2 c){return fract(sin(dot(c,vec2(12.9898,78.233)))*43758.5453);}
    void main(){
      vec2 uv=vUv;
      if(uPixel>0.5){ vec2 px=uRes/uPixel; uv=(floor(vUv*px)+0.5)/px; }
      vec3 col=texture2D(tDiffuse,uv).rgb;
      if(uPoster>0.5){ float l=uPoster; float d=(rnd(floor(vUv*uRes))-0.5)*0.6; col=floor(col*l+0.5+d)/l; }
      col=(col-0.5)*uContrast+0.5;
      if(uDesat>0.001){ float gl=dot(col,vec3(0.299,0.587,0.114)); col=mix(col,vec3(gl),uDesat); }
      col*=uTint;
      if(uCine>0.01){
        vec3 c=col; c=(c-0.5)*1.14+0.5;
        float lum=dot(c,vec3(0.299,0.587,0.114));
        c=mix(vec3(lum),c,0.82);
        c+=vec3(-0.02,0.0,0.035)*(1.0-lum); c+=vec3(0.045,0.02,-0.02)*lum;
        col=mix(col,c,uCine);
        float dd=distance(vUv,vec2(0.5)); col*=1.0-uCine*0.55*smoothstep(0.32,0.85,dd);
      }
      col=(col-0.5)*uMCon+0.5; col*=uMBright;
      if(uMDesat>0.001){ float _ml=dot(col,vec3(0.299,0.587,0.114)); col=mix(col,vec3(_ml),uMDesat); }
      col*=uMTint;
      if(uScan>0.01){
        float s=sin(vUv.y*uRes.y*1.4)*0.5+0.5; col*=1.0-uScan*0.35*s;
        float o=uScan*1.4/uRes.x;
        col.r=texture2D(tDiffuse,uv+vec2(o,0.)).r; col.b=texture2D(tDiffuse,uv-vec2(o,0.)).b;
      }
      if(uGrain>0.01){ col+=(rnd(vUv*uRes+fract(uTime))-0.5)*uGrain*0.13; }
      if(uCine>0.5){ float bar=0.105; if(vUv.y<bar||vUv.y>1.0-bar) col=vec3(0.0); }
      gl_FragColor=vec4(col,1.0);
    }`
};
let composer=null,fxPass=null,hasComposer=false,fxActive=false;
try{
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  fxPass=new ShaderPass(FX); composer.addPass(fxPass);
  hasComposer=true;
}catch(e){ console.error('postprocessing init failed',e); hasComposer=false; }
function sizeComposer(){
  if(!hasComposer) return;
  composer.setSize(innerWidth,innerHeight);
  const v=renderer.getDrawingBufferSize(new THREE.Vector2());
  fxPass.uniforms.uRes.value.copy(v);
}
sizeComposer();
function updateFxActive(){
  if(!hasComposer){ fxActive=false; return; }
  const u=fxPass.uniforms, t=u.uTint.value, mt=u.uMTint.value;
  fxActive = u.uPixel.value>0.5||u.uPoster.value>0.5||u.uScan.value>0.01||u.uCine.value>0.01||u.uGrain.value>0.01
    ||u.uDesat.value>0.01||Math.abs(u.uContrast.value-1)>0.01||t.x!==1||t.y!==1||t.z!==1
    ||u.uMDesat.value>0.01||Math.abs(u.uMCon.value-1)>0.01||Math.abs(u.uMBright.value-1)>0.01||mt.x!==1||mt.y!==1||mt.z!==1;
}

// ---------- cave black & white (shader inject, shared uniform) ----------
const uBW={value:1.0};
function applyCaveBW(mat){
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uBW=uBW;
    sh.fragmentShader='uniform float uBW;\n'+sh.fragmentShader.replace(
      '#include <map_fragment>',
      '#include <map_fragment>\n float _bwl=dot(diffuseColor.rgb,vec3(0.299,0.587,0.114)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(_bwl),uBW);'
    );
  };
  mat.needsUpdate=true;
}

// ---------- character colour grade (shader inject) ----------
const CHAR={bright:{value:1.0},sat:{value:1.0},con:{value:1.0},tint:{value:new THREE.Color(0xffffff)}};
function applyCharGrade(mat){
  const prev=mat.onBeforeCompile;
  mat.onBeforeCompile=(sh)=>{
    if(prev) prev(sh);
    sh.uniforms.uCB=CHAR.bright; sh.uniforms.uCS=CHAR.sat; sh.uniforms.uCC=CHAR.con; sh.uniforms.uCT=CHAR.tint;
    sh.fragmentShader='uniform float uCB,uCS,uCC; uniform vec3 uCT;\n'+sh.fragmentShader.replace(
      '#include <color_fragment>',
      '#include <color_fragment>\n diffuseColor.rgb=(diffuseColor.rgb-0.5)*uCC+0.5; diffuseColor.rgb*=uCB; float _cgl=dot(diffuseColor.rgb,vec3(0.299,0.587,0.114)); diffuseColor.rgb=mix(vec3(_cgl),diffuseColor.rgb,uCS); diffuseColor.rgb*=uCT; diffuseColor.rgb=clamp(diffuseColor.rgb,0.0,1.0);'
    );
  };
  mat.needsUpdate=true;
}
const draco=new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const gltf=new GLTFLoader().setDRACOLoader(draco);
const fbx=new FBXLoader();
function loadFB(loader,urls){return new Promise((res,rej)=>{const t=i=>loader.load(urls[i],res,undefined,e=>{i+1<urls.length?t(i+1):rej(e);});t(0);});}

// ---------- loader UI ----------
const loaderEl=document.getElementById('loader'),ltxt=document.getElementById('ltxt'),
  lbar=document.querySelector('#lbar i'),lerr=document.getElementById('lerr');
const moods=['에셋 불러오는 중…','굴다리에 어둠을 채우는 중…','안개를 깔고 있음…','캐릭터를 세우는 중…'];

let ac=null,master=null,noiseBuf=null,droneNodes=null,muted=false,vol=0.6;

const BGM_SRC=['https://cdn.jsdelivr.net/gh/sukyonghyun-sudo/lowpoly@main/lee/Chant%20Furnace.mp3',

function audioWake(){ if(!ac) initAudio(); if(ac&&ac.state==='suspended') ac.resume(); setupBGM(); }
function setupBGM(){
  if(bgm||!ac||!master) return;
  try{
    bgm=new Audio(); bgm.loop=true; bgm.crossOrigin='anonymous'; bgm.preload='auto';
    let si=0; bgm.src=BGM_SRC[0];
    bgm.addEventListener('error',()=>{ si++; if(si<BGM_SRC.length){ bgm.src=BGM_SRC[si]; bgm.play().catch(()=>{}); } else { console.warn('[bgm] load failed (파일 경로 확인)'); } });
    const node=ac.createMediaElementSource(bgm);
    bgmGain=ac.createGain(); bgmGain.gain.value=bgmOn?bgmVol:0;
    node.connect(bgmGain).connect(master);
    bgm.play().then(()=>console.log('[bgm] playing')).catch(e=>console.warn('[bgm] play blocked',e));
  }catch(e){ console.warn('[bgm] setup',e); }
}
function initAudio(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=muted?0:vol; master.connect(ac.destination);
    const n=Math.floor(ac.sampleRate); noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }catch(e){}
}
function footstep(){
  if(!ac||muted) return; const t=ac.currentTime;
  const o=ac.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(50,t+0.1);
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.4,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g).connect(master); o.start(t); o.stop(t+0.18);
  const s=ac.createBufferSource(); s.buffer=noiseBuf;
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=0.8;
  const ng=ac.createGain(); ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(0.1,t+0.004); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  s.connect(bp).connect(ng).connect(master); s.start(t); s.stop(t+0.1);
}
function jumpscareSound(){
  audioWake(); if(!ac||muted) return; const t=ac.currentTime;
  [0,7,12].forEach((semi,k)=>{
    const o=ac.createOscillator(); o.type='sawtooth'; const b=180*Math.pow(2,semi/12);
    o.frequency.setValueAtTime(b,t); o.frequency.exponentialRampToValueAtTime(b*4,t+0.5);
    o.detune.value=(k-1)*15;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.28,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.8);
    o.connect(g).connect(master); o.start(t); o.stop(t+0.85);
  });
  const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  const ng=ac.createGain(); ng.gain.setValueAtTime(0.0001,t);
  ng.gain.exponentialRampToValueAtTime(0.45,t+0.01); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
  s.connect(hp).connect(ng).connect(master); s.start(t); s.stop(t+0.75);
  const so=ac.createOscillator(); so.type='sine';
  so.frequency.setValueAtTime(80,t); so.frequency.exponentialRampToValueAtTime(28,t+0.6);
  const sg=ac.createGain(); sg.gain.setValueAtTime(0.0001,t);
  sg.gain.exponentialRampToValueAtTime(0.7,t+0.02); sg.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
  so.connect(sg).connect(master); so.start(t); so.stop(t+0.95);
}
function setDrone(on){
  audioWake(); if(!ac) return;
  if(on&&!droneNodes){
    const g=ac.createGain(); g.gain.value=0.05; g.connect(master);
    const o1=ac.createOscillator(); o1.type='sine'; o1.frequency.value=55;
    const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=58.3;
    const lfo=ac.createOscillator(); lfo.frequency.value=0.12;
    const lg=ac.createGain(); lg.gain.value=0.025; lfo.connect(lg).connect(g.gain);
    o1.connect(g); o2.connect(g); o1.start(); o2.start(); lfo.start();
    droneNodes={o1,o2,lfo,g};

    const {o1,o2,lfo,g}=droneNodes,t=ac.currentTime;

    setTimeout(()=>{try{o1.stop();o2.stop();lfo.stop();}catch(e){}},600); droneNodes=null;
  }
}

function groundObject(obj,targetH){
  obj.updateMatrixWorld(true);
  let box=new THREE.Box3().setFromObject(obj);
  if(targetH){ const h=box.max.y-box.min.y; if(h>0)obj.scale.multiplyScalar(targetH/h);
    obj.updateMatrixWorld(true); box=new THREE.Box3().setFromObject(obj); }
  obj.position.y-=box.min.y;
  const c=box.getCenter(new THREE.Vector3()); obj.position.x-=c.x; obj.position.z-=c.z;
  obj.updateMatrixWorld(true); return new THREE.Box3().setFromObject(obj);
}
function makeInPlace(clip){

  }
  return clip;
}

    cave.traverse(o=>{ if(o.isMesh){ o.castShadow=true;o.receiveShadow=true;
      const ms=Array.isArray(o.material)?o.material:[o.material]; ms.forEach(applyCaveBW); } });
    scene.add(cave);
    const cb=groundObject(cave,null); const cs=cb.getSize(new THREE.Vector3());
    cvScale0=cave.scale.x; lastCaveSize.copy(cs);
    longAxis = cs.x>=cs.z ? 'x':'z';
    caveCenter = longAxis==='x' ? (cb.min.x+cb.max.x)/2 : (cb.min.z+cb.max.z)/2;

    const f=await loadFB(fbx,SRC.char); setProg('70%');
    charRoot=f; let hasTex=false;
    charRoot.traverse(o=>{ if(o.isMesh||o.isSkinnedMesh){
      o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
      (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(!m)return;
        if(m.map){hasTex=true;m.map.colorSpace=THREE.SRGBColorSpace;m.color&&m.color.set(0xffffff);}
        else if(m.color){const c=m.color; if(c.r+c.g+c.b<0.15)c.set(0x9aa0a8);}
        if('roughness'in m)m.roughness=0.85; if('metalness'in m)m.metalness=0.0; applyCharGrade(m); m.needsUpdate=true; });
    }});
    console.log('[char] embedded texture detected:',hasTex);
    scene.add(charRoot); groundObject(charRoot,1.8);
    groundY=charRoot.position.y; scale0=charRoot.scale.x;

    const idleFbx=await loadFB(fbx,SRC.idle).catch(()=>null); setProg('92%');

    if(f.animations&&f.animations.length){
      mixer=new THREE.AnimationMixer(charRoot);
      walkAction=mixer.clipAction(makeInPlace(f.animations[0]));
      walkAction.play(); walkAction.setEffectiveWeight(0);

      const wrap=new THREE.Group(); wrap.add(trash); trash=wrap;
      trashBaseScale=0.32/Math.max(tsz.x,tsz.y,tsz.z,0.001);
      if(!isFinite(trashBaseScale)||trashBaseScale<=0) trashBaseScale=0.01;

// ---------- movement + collision ----------
const _mvF=new THREE.Vector3(),_mvR=new THREE.Vector3(),_mvDir=new THREE.Vector3(),_cdir=new THREE.Vector3();
const ray=new THREE.Raycaster(); const AX=[new THREE.Vector3(1,0,0),new THREE.Vector3(0,0,1)];
const _ro=new THREE.Vector3(),_rd=new THREE.Vector3();
function castAxis(axis,amt){
  if(amt===0) return 0; const R=state.bodyR,sign=Math.sign(amt),dist=Math.abs(amt);
  _rd.copy(axis).multiplyScalar(sign); _ro.copy(charRoot.position); _ro.y+=0.9;
  ray.set(_ro,_rd); ray.far=dist+R;
  const h=ray.intersectObject(cave,true);
  if(h.length&&h[0].distance<dist+R) return sign*Math.max(0,h[0].distance-R);
  return amt;
}
function moveChar(dx,dz){
  if(!state.collide||!cave){ charRoot.position.x+=dx; charRoot.position.z+=dz; return; }
  charRoot.position.x+=castAxis(AX[0],dx); charRoot.position.z+=castAxis(AX[1],dz);
}
function updateMovement(dt){
  if(!charRoot) return false;
  let inz=(keys.fwd?1:0)-(keys.back?1:0)+joy.y;
  let inx=(keys.right?1:0)-(keys.left?1:0)+joy.x;
  let mag=Math.hypot(inx,inz);
  if(mag<0.08) return false; if(mag>1) mag=1;
  camera.getWorldDirection(_cdir); const yaw=Math.atan2(_cdir.x,_cdir.z);
  _mvF.set(Math.sin(yaw),0,Math.cos(yaw));
  _mvR.set(Math.sin(yaw-Math.PI/2),0,Math.cos(yaw-Math.PI/2)); // corrected left/right
  _mvDir.set(0,0,0).addScaledVector(_mvF,inz).addScaledVector(_mvR,inx);
  if(_mvDir.lengthSq()===0) return false; _mvDir.normalize();
  const d=state.moveSpeed*dt*mag; moveChar(_mvDir.x*d,_mvDir.z*d);
  const tgt=Math.atan2(_mvDir.x,_mvDir.z)+state.faceOffset;
  let diff=((tgt-charRoot.rotation.y+Math.PI)%(Math.PI*2))-Math.PI; if(diff<-Math.PI)diff+=Math.PI*2;
  charRoot.rotation.y+=diff*state.turnLerp; return true;
}

// ---------- keep feet on the floor surface (handles raised tunnel floor) ----------
const _dn=new THREE.Vector3(0,-1,0),_up=new THREE.Vector3(0,1,0),_or=new THREE.Vector3();
function stickToFloor(){
  if(!charRoot) return;
  const h=1.8*(charRoot.scale.x/scale0);
  const x=charRoot.position.x, z=charRoot.position.z;
  const objs = cave ? [cave,ground] : [ground];
  const feet=charRoot.position.y-groundY;
  // primary: cast DOWN from above (reference uses last floor for stability, stays below ceiling)
  const oy = Math.max(feet,lastFloorY) + h + 0.9;
  ray.set(_or.set(x,oy,z),_dn); ray.far=oy+8;
  let hit=ray.intersectObjects(objs,true)[0];
  // if inside the tunnel footprint but we only hit the global ground, the real floor is the cave floor above -> cast UP
  if(cave){
    caveBox3.setFromObject(cave);
    const insideXZ = x>caveBox3.min.x && x<caveBox3.max.x && z>caveBox3.min.z && z<caveBox3.max.z;
    if(insideXZ && (!hit || hit.object===ground)){
      ray.set(_or.set(x,feet-0.3,z),_up); ray.far=h+3;
      const upHit=ray.intersectObject(cave,true)[0];
      if(upHit) hit=upHit;
    }
  }
  if(hit){
    lastFloorY=hit.point.y;
    const target=groundY+lastFloorY+state.footOffset;
    charRoot.position.y += (target-charRoot.position.y)*0.5;
  }
}

    const p=charRoot.position;
    trash.position.set(p.x+0.9+state.trash.x, p.y+1.1+state.trash.y, p.z+0.2+state.trash.z);
    trash.rotation.set(state.trash.rx*D2R, state.trash.ry*D2R, state.trash.rz*D2R);
    trash.scale.setScalar(trashBaseScale*state.trash.scale);
    return;
  }
  const name=state.trash.hand==='left'?'mixamorig:LeftHand':'mixamorig:RightHand';
  const bone=charRoot.getObjectByName(name);
  if(!bone){ trash.visible=false; return; }
  trash.visible=true;
  bone.updateWorldMatrix(true,false);
  bone.getWorldPosition(_tp); bone.getWorldQuaternion(_tq);
  _to.set(state.trash.x,state.trash.y,state.trash.z).applyQuaternion(_tq);
  trash.position.copy(_tp).add(_to);
  _tlr.setFromEuler(_te.set(state.trash.rx*D2R,state.trash.ry*D2R,state.trash.rz*D2R));
  trash.quaternion.copy(_tq).multiply(_tlr);
  trash.scale.setScalar(trashBaseScale*state.trash.scale);
}

// place character just outside the tunnel's near entrance, facing in
function spawnAtEntrance(){
  if(!cave||!charRoot) return;
  caveBox3.setFromObject(cave);
  charRoot.position.x=(caveBox3.min.x+caveBox3.max.x)/2;
  charRoot.position.z=caveBox3.min.z-1.6;
  charRoot.rotation.y=0;
  camera.position.set(charRoot.position.x,charRoot.position.y+state.camHeight,charRoot.position.z-state.camDist);
}

// ---------- camera follow ----------
const _camPos=new THREE.Vector3(),_look=new THREE.Vector3(),_f=new THREE.Vector3();
function updateFollow(){
  if(!state.follow||!charRoot) return;
  const p=charRoot.position;
  _camPos.set(p.x+state.camDist*Math.sin(state.camYaw), p.y+state.camHeight, p.z+state.camDist*Math.cos(state.camYaw));
  camera.position.lerp(_camPos,0.15);
  _look.copy(p).add(new THREE.Vector3(0,state.camLook,0));
  camera.lookAt(_look);
  controls.target.copy(_look);
}

// ---------- atmosphere / tunnel events ----------
function updateAtmosphere(dt){
  if(!cave||!charRoot) return;
  caveBox3.setFromObject(cave);
  const p=charRoot.position;
  const inside = p.x>caveBox3.min.x+0.2 && p.x<caveBox3.max.x-0.2 &&
                 p.z>caveBox3.min.z+0.2 && p.z<caveBox3.max.z-0.2 &&
                 p.y<caveBox3.max.y;
  insideTunnel=inside;
  tunnelT += ((inside?1:0)-tunnelT)*Math.min(1,dt*4);
  const t = (debugBright||!state.events) ? 0 : tunnelT;
  const k = 1 - t*state.blackout;
  ambient.intensity = (debugBright?1.6:base.amb)*k;
  hemi.intensity    = (debugBright?1.4:base.hemi)*k;
  moon.intensity    = base.moon*(1-t);
  renderer.toneMappingExposure = debugBright?1.6:base.exposure;
  if(scene.fog) scene.fog.density = base.fogD*(1+t*(state.fogMul-1));
  // auto flashlight inside
  if(state.events && tunnelT>0.2 && !state.flashOn){ state.flashOn=true; flash.intensity=state.flashInt; refreshFlashBtn(); }
  // jumpscare trigger: cross tunnel centre while inside
  if(inside && state.events && state.jumpscareOn && jumpArmed){
    const ap = longAxis==='x'?p.x:p.z; const side=ap>caveCenter?1:-1;
    if(lastSide!==null && side!==lastSide){ fireJumpscare(); jumpArmed=false; }
    lastSide=side;
  } else if(!inside){ lastSide=null; }
}

// ---------- render loop ----------
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const moving=updateMovement(dt);
  stickToFloor();
  if(mixer){
    const tw=moving?1:0; walkW+=((tw-walkW))*Math.min(1,dt*8);
    if(walkAction) walkAction.setEffectiveWeight(walkW), walkAction.setEffectiveTimeScale(state.walkSpeed);
    if(idleAction) idleAction.setEffectiveWeight(1-walkW);
    mixer.update(dt);
  }
  updateTrash();
  updateShadow();
  updateAtmosphere(dt);
  updateFollow();
  // footsteps
  if(moving && state.audioFootsteps){ stepTimer-=dt; if(stepTimer<=0){ footstep(); stepTimer=Math.max(0.22,0.5/(state.moveSpeed/2.4)); } }
  else stepTimer=0;
  // flashlight aim
  flashTarget.position.copy(camera.position).add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(10));
  // screen shake
  if(shakeAmp>0.001){ camera.position.x+=(Math.random()-0.5)*shakeAmp; camera.position.y+=(Math.random()-0.5)*shakeAmp; shakeAmp*=0.88; }
  controls.update();
  if(fxActive && hasComposer){
    fxPass.uniforms.uTime.value+=dt;
    try{ composer.render(); }
    catch(e){ console.error('composer render failed -> fallback',e); fxActive=false; hasComposer=false; renderer.render(scene,camera); }
  } else {
    renderer.render(scene,camera);
  }
  syncReadout();
}
animate(); boot();

});

function section(title,open,rows){const d=document.createElement('details');if(open)d.open=true;

  const b=document.createElement('div');b.className='body';rows.forEach(r=>b.appendChild(r));
  d.appendChild(s);d.appendChild(b);return d;}
function decimals(step){ const d=-Math.floor(Math.log10(step)); return Math.max(0,Math.min(4,isFinite(d)?d:0)); }
function holdRepeat(btn,fn){ let to,iv;
  const stop=()=>{clearTimeout(to);clearInterval(iv);to=iv=null;};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();fn();to=setTimeout(()=>{iv=setInterval(fn,60);},320);});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
}
function slider(label,min,max,step,val,fmt,on){
  const row=document.createElement('div'); row.className='row';
  const lab=document.createElement('label');
  const sp=document.createElement('span'); sp.textContent=label;
  const st=document.createElement('div'); st.className='stepper';
  const minus=document.createElement('button'); minus.type='button'; minus.className='step'; minus.textContent='−';
  const num=document.createElement('input'); num.type='number'; num.className='num'; num.min=min; num.max=max; num.step=step;
  const plus=document.createElement('button'); plus.type='button'; plus.className='step'; plus.textContent='+';
  st.append(minus,num,plus); lab.append(sp,st);
  const i=document.createElement('input'); i.type='range'; i.min=min; i.max=max; i.step=step; i.value=val;
  row.append(lab,i);
  const dec=decimals(step), clamp=x=>Math.min(max,Math.max(min,x)), show=x=>parseFloat(Number(x).toFixed(dec));
  function set(x,silent){ if(isNaN(x))return; x=clamp(x); const fx=show(x); i.value=fx; num.value=fx; if(!silent) on(parseFloat(i.value)); }
  i.oninput=()=>{ num.value=show(parseFloat(i.value)); on(parseFloat(i.value)); };
  num.onchange=()=>set(parseFloat(num.value));
  num.onkeydown=e=>{ if(e.key==='Enter') num.blur(); };
  holdRepeat(minus,()=>set(parseFloat(i.value)-step));
  holdRepeat(plus, ()=>set(parseFloat(i.value)+step));
  num.value=show(val);
  row._set=nv=>{ i.value=nv; num.value=show(parseFloat(nv)); };
  return row;
}

    b.textContent=txt;if(init)b.classList.add('on');

  const aFs=btnRow([['👣 발소리',null,()=>{state.audioFootsteps=!state.audioFootsteps;return state.audioFootsteps;},true,state.audioFootsteps]]);
  const aBgm=btnRow([['🎵 배경음악 (Chant Furnace)',null,()=>{ bgmOn=!bgmOn; if(bgmGain)bgmGain.gain.value=bgmOn?bgmVol:0; if(bgmOn&&bgm&&bgm.paused)bgm.play().catch(()=>{}); else setupBGM(); return bgmOn; },true,bgmOn]]);
  const aBgmV=slider('배경음악 볼륨',0,1,.02,bgmVol,ipct,v=>{ bgmVol=v; if(bgmGain&&bgmOn)bgmGain.gain.value=v; });
  panel.appendChild(section('오디오 / Audio',false,[aMute,aVol,aFs,aBgm,aBgmV]));

  // EXPORT / IMPORT  — copy these values and paste them to Claude to apply as defaults
  const io=document.createElement('textarea'); io.className='io'; io.spellcheck=false;
  io.placeholder='[모든 설정 저장]을 누르면 여기에 JSON이 나옵니다.\n붙여넣고 [적용]을 누르면 그대로 불러옵니다.';
  const ioBtns=btnRow([
    ['💾 모든 설정 저장(복사)',null,()=>{ const j=JSON.stringify(collectSettings(),null,2); io.value=j; io.focus(); io.select(); try{navigator.clipboard.writeText(j);}catch(e){} },false],
    ['📥 적용(붙여넣기)',null,()=>{ try{ applySettings(JSON.parse(io.value)); }catch(e){ showErr('JSON 파싱 오류: '+(e&&e.message||e)); } },false]]);
  panel.appendChild(section('설정 저장 / Export·Import',true,[ioBtns,io]));

  // TOOLS
  const reset=btnRow([
    ['↻ 카메라 리셋',null,()=>{ state.camYaw=Math.PI; if(charRoot){camera.position.set(charRoot.position.x,charRoot.position.y+state.camHeight,charRoot.position.z-state.camDist);} },false],
    ['↻ 재무장',null,()=>{jumpArmed=true;lastSide=null;},false]]);
  const ro=document.createElement('div');ro.className='readout';ro.id='readout';
  panel.appendChild(section('도구 / 값',false,[reset,ro]));
}

function collectSettings(){
  const hx=c=>'#'+new THREE.Color(c).getHexString();
  const u=hasComposer?fxPass.uniforms:null, tn=u?u.uTint.value:{x:1,y:1,z:1};
  return {
    character:{ x:+charRoot.position.x.toFixed(3), z:+charRoot.position.z.toFixed(3),
      footOffset:+state.footOffset.toFixed(3), scaleMul:+(charRoot.scale.x/scale0).toFixed(3), faceFlipped:state.faceOffset!==0 },
    characterColour:{ brightness:+CHAR.bright.value.toFixed(3), contrast:+CHAR.con.value.toFixed(3),
      saturation:+CHAR.sat.value.toFixed(3), tint:hx(CHAR.tint.value) },
    cave:{ x:+cave.position.x.toFixed(3), y:+cave.position.y.toFixed(3), z:+cave.position.z.toFixed(3),
      rotYdeg:+(cave.rotation.y*180/Math.PI).toFixed(1), scaleMul:+(cave.scale.x/cvScale0).toFixed(3), blackWhite:uBW.value>0.5 },
    movement:{ moveSpeed:+state.moveSpeed.toFixed(2), walkAnimSpeed:+state.walkSpeed.toFixed(2), collide:state.collide, bodyRadius:+state.bodyR.toFixed(3) },
    camera:{ yawDeg:+(state.camYaw*180/Math.PI).toFixed(1), dist:+state.camDist.toFixed(2), height:+state.camHeight.toFixed(2),
      look:+state.camLook.toFixed(2), fov:state.fov, follow:state.follow },
    lighting:{ ambient:+base.amb.toFixed(3), moon:+base.moon.toFixed(3), exposure:+base.exposure.toFixed(3), flashOn:state.flashOn, flashIntensity:state.flashInt },
    tunnelEvents:{ enabled:state.events, blackout:+state.blackout.toFixed(2), fogMultiplier:+state.fogMul.toFixed(1), jumpscare:state.jumpscareOn },
    fog:{ density:+base.fogD.toFixed(3), color:hx(scene.background) },
    shadow:{ contact:state.contactShadow, opacity:+blob.material.opacity.toFixed(2) },
    audio:{ muted:muted, volume:+vol.toFixed(2), footsteps:state.audioFootsteps, bgm:bgmOn, bgmVolume:+bgmVol.toFixed(2) },
    filters: u?{ pixel:u.uPixel.value, posterize:u.uPoster.value, scanline:+u.uScan.value.toFixed(2), cinematic:u.uCine.value>0.5,
      grain:+u.uGrain.value.toFixed(2), desaturate:+u.uDesat.value.toFixed(2), contrast:+u.uContrast.value.toFixed(2),
      screenTint:'#'+new THREE.Color(tn.x,tn.y,tn.z).getHexString() }:null,
    mood: u?{ desaturate:+u.uMDesat.value.toFixed(2), contrast:+u.uMCon.value.toFixed(2), brightness:+u.uMBright.value.toFixed(2),
      tint:'#'+new THREE.Color(u.uMTint.value.x,u.uMTint.value.y,u.uMTint.value.z).getHexString() }:null,
    trash:{ hand:state.trash.hand, x:+state.trash.x.toFixed(3), y:+state.trash.y.toFixed(3), z:+state.trash.z.toFixed(3),
      rotX:state.trash.rx, rotY:state.trash.ry, rotZ:state.trash.rz, scale:+state.trash.scale.toFixed(3) }
  };
}
function applySettings(s){
  if(!s) return;
  const C=s.character; if(C){ if('x'in C)charRoot.position.x=C.x; if('z'in C)charRoot.position.z=C.z;
    if('footOffset'in C)state.footOffset=C.footOffset; if('scaleMul'in C)charRoot.scale.setScalar(scale0*C.scaleMul);
    if('faceFlipped'in C)state.faceOffset=C.faceFlipped?Math.PI:0; }
  const cc=s.characterColour; if(cc){ if('brightness'in cc)CHAR.bright.value=cc.brightness; if('contrast'in cc)CHAR.con.value=cc.contrast;
    if('saturation'in cc)CHAR.sat.value=cc.saturation; if(cc.tint)CHAR.tint.value.set(cc.tint); }
  const cv=s.cave; if(cv){ if('x'in cv)cave.position.x=cv.x; if('y'in cv)cave.position.y=cv.y; if('z'in cv)cave.position.z=cv.z;
    if('rotYdeg'in cv)cave.rotation.y=cv.rotYdeg*D2R; if('scaleMul'in cv)cave.scale.setScalar(cvScale0*cv.scaleMul); if('blackWhite'in cv)uBW.value=cv.blackWhite?1:0; }
  const mv=s.movement; if(mv){ if('moveSpeed'in mv)state.moveSpeed=mv.moveSpeed; if('walkAnimSpeed'in mv)state.walkSpeed=mv.walkAnimSpeed;
    if('collide'in mv)state.collide=mv.collide; if('bodyRadius'in mv)state.bodyR=mv.bodyRadius; }
  const cm=s.camera; if(cm){ if('yawDeg'in cm)state.camYaw=cm.yawDeg*D2R; if('dist'in cm)state.camDist=cm.dist; if('height'in cm)state.camHeight=cm.height;
    if('look'in cm)state.camLook=cm.look; if('fov'in cm){state.fov=cm.fov;camera.fov=cm.fov;camera.updateProjectionMatrix();}
    if('follow'in cm){state.follow=cm.follow;controls.enabled=!cm.follow;} }
  const li=s.lighting; if(li){ if('ambient'in li)base.amb=li.ambient; if('moon'in li)base.moon=li.moon; if('exposure'in li)base.exposure=li.exposure;
    if('flashOn'in li)state.flashOn=li.flashOn; if('flashIntensity'in li)state.flashInt=li.flashIntensity; flash.intensity=state.flashOn?state.flashInt:0; }
  const te=s.tunnelEvents; if(te){ if('enabled'in te)state.events=te.enabled; if('blackout'in te)state.blackout=te.blackout;
    if('fogMultiplier'in te)state.fogMul=te.fogMultiplier; if('jumpscare'in te)state.jumpscareOn=te.jumpscare; }
  const fg=s.fog; if(fg){ if('density'in fg)base.fogD=fg.density; if(fg.color){const c=new THREE.Color(fg.color);scene.background=c;if(scene.fog)scene.fog.color.copy(c);} }
  const sh=s.shadow; if(sh){ if('contact'in sh)state.contactShadow=sh.contact; if('opacity'in sh)blob.material.opacity=sh.opacity; }
  const au=s.audio; if(au){ if('muted'in au)muted=au.muted; if('volume'in au)vol=au.volume; if('footsteps'in au)state.audioFootsteps=au.footsteps;
    if('bgm'in au)bgmOn=au.bgm; if('bgmVolume'in au)bgmVol=au.bgmVolume; if(bgmGain)bgmGain.gain.value=bgmOn?bgmVol:0; if(master)master.gain.value=muted?0:vol; }
  const fl=s.filters; if(fl&&hasComposer){ const u=fxPass.uniforms; if('pixel'in fl)u.uPixel.value=fl.pixel; if('posterize'in fl)u.uPoster.value=fl.posterize;
    if('scanline'in fl)u.uScan.value=fl.scanline; if('cinematic'in fl)u.uCine.value=fl.cinematic?1:0; if('grain'in fl)u.uGrain.value=fl.grain;
    if('desaturate'in fl)u.uDesat.value=fl.desaturate; if('contrast'in fl)u.uContrast.value=fl.contrast;
    if(fl.screenTint){const c=new THREE.Color(fl.screenTint);u.uTint.value.set(c.r,c.g,c.b);} updateFxActive(); }
  const md=s.mood; if(md&&hasComposer){ const u=fxPass.uniforms;
    if('desaturate'in md)u.uMDesat.value=md.desaturate; if('contrast'in md)u.uMCon.value=md.contrast; if('brightness'in md)u.uMBright.value=md.brightness;
    if(md.tint){const c=new THREE.Color(md.tint);u.uMTint.value.set(c.r,c.g,c.b);} updateFxActive(); }
  const tr=s.trash; if(tr){ if('hand'in tr)state.trash.hand=tr.hand; if('x'in tr)state.trash.x=tr.x; if('y'in tr)state.trash.y=tr.y; if('z'in tr)state.trash.z=tr.z;
    if('rotX'in tr)state.trash.rx=tr.rotX; if('rotY'in tr)state.trash.ry=tr.rotY; if('rotZ'in tr)state.trash.rz=tr.rotZ; if('scale'in tr)state.trash.scale=tr.scale; }
  buildPanel(lastCaveSize);
}

function currentT(){ if(!charRoot||!cave)return'';const p=charRoot.position,cp=cave.position;
  return `char pos(${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)}) rotY ${(charRoot.rotation.y*180/Math.PI).toFixed(0)} scale ${charRoot.scale.x.toFixed(3)}\ncave pos(${cp.x.toFixed(2)},${cp.y.toFixed(2)},${cp.z.toFixed(2)}) rotY ${(cave.rotation.y*180/Math.PI).toFixed(0)} scale ${cave.scale.x.toFixed(3)}`;}
function copyVals(){try{navigator.clipboard.writeText(currentT());}catch(e){}}
function syncReadout(){
  const co=document.getElementById('coords');
  if(co&&charRoot){ const p=charRoot.position;
    co.innerHTML=`<b>X</b> ${p.x.toFixed(2)}  <b>Y</b> ${p.y.toFixed(2)}  <b>Z</b> ${p.z.toFixed(2)}`+(insideTunnel?'  <span class="in">[터널 안]</span>':''); }
  const ro=document.getElementById('readout');
  if(ro&&charRoot&&cave){const p=charRoot.position;
    ro.innerHTML=`<b>캐릭터</b> X ${p.x.toFixed(2)} Y ${p.y.toFixed(2)} Z ${p.z.toFixed(2)}\n<b>터널 진입</b> ${(tunnelT*100|0)}%   <b>점프스케어</b> ${jumpArmed?'대기':'발동됨'}`;}}
</script>
